<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retail Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%231A6C8C'/><text x='50' y='72' font-size='64' font-family='Georgia,serif' font-weight='700' fill='white' text-anchor='middle'>S</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="login" class="login-screen" hidden>
    <div style="width:100%;max-width:420px">
      <div class="login-brand">
        <div class="mark" id="login-mark">S</div>
        <div>
          <div style="font-family:var(--serif);font-size:26px;font-weight:600;line-height:1" id="login-brand-name">Retail Manager</div>
          <div class="small muted" style="margin-top:4px">Computer Retail</div>
        </div>
      </div>
      <form class="login-card" id="login-form">
        <h1>Sign in</h1>
        <p>Welcome back. Enter your details to open the shop.</p>
        <label>Email<input type="email" name="email" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required></label>
        <div class="field-error" id="login-error" hidden></div>
        <button class="btn primary block tall" type="submit" style="margin-top:24px">Sign in</button>
      </form>
    </div>
  </div>

  <div id="shell" hidden>
    <main class="main">
      <header class="topbar">
        <div class="brand">
          <div class="mark small" id="brand-mark">S</div>
          <div style="min-width:0">
            <div class="name" id="brand-name">Retail Manager</div>
          </div>
        </div>
        <a class="btn" id="home-link" href="#/">🏠 Dashboard</a>
        <div class="global-search">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4843" stroke-width="1.8" stroke-linecap="round"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-4.3-4.3"/></svg>
          <input type="search" id="global-search" placeholder="Search products, invoices, customers…" autocomplete="off">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="topbar-actions">
          <span class="today" id="today"></span>
          <button class="btn" id="bell" aria-label="Notifications" style="gap:8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="badge" id="bell-count" hidden></span>
          </button>
          <div class="user-chip" id="user-chip"></div>
        </div>
      </header>

      <div class="notification-panel" id="notification-panel" hidden></div>
      <div class="view" id="backbar" style="padding-bottom:0"></div>
      <div id="view" class="view" style="padding-top:0"></div>
    </main>
  </div>

  <div id="toast-stack" class="toast-stack"></div>
  <div id="modal-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/inventory.js"></script>
  <script src="/js/pages/purchases.js"></script>
  <script src="/js/pages/sales.js"></script>
  <script src="/js/pages/parties.js"></script>
  <script src="/js/pages/reports.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/pages/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
