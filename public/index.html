<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Computer Business Management System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="login" class="login-screen" hidden>
    <form class="login-card" id="login-form">
      <h1>Business Control Center</h1>
      <p class="muted">Sign in to manage inventory, sales and analytics.</p>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <div class="error" id="login-error" hidden></div>
      <button class="btn primary block" type="submit">Sign in</button>
      <p class="muted small">Demo login: owner@example.com / owner123</p>
    </form>
  </div>

  <div id="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">🖥️</span><span id="brand-name">My Computer Store</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div id="user-chip" class="user-chip"></div>
        <button class="btn ghost small" id="logout">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn ghost icon" id="menu-toggle" aria-label="Toggle menu">☰</button>
        <div class="global-search">
          <input type="search" id="global-search" placeholder="Search products, serial numbers, invoices, customers…" autocomplete="off">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost icon" id="bell" aria-label="Notifications">🔔<span class="badge" id="bell-count" hidden></span></button>
          <a class="btn primary small" href="#/sales/create">+ New Invoice</a>
        </div>
      </header>

      <div class="notification-panel" id="notification-panel" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toast-stack" class="toast-stack"></div>
  <div id="modal-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/inventory.js"></script>
  <script src="/js/pages/purchases.js"></script>
  <script src="/js/pages/sales.js"></script>
  <script src="/js/pages/parties.js"></script>
  <script src="/js/pages/reports.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
